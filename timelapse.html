<!doctype html>
<html data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="constracti">
		<link rel="icon" href="flag.png">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<link rel="stylesheet" href="live.css">
		<style id="game-style"></style>
	</head>
	<body class="d-flex flex-column timelapse">
		<div class="position-relative m-auto p-2 p-md-0" id="canvas">
			<section class="p-md-2" id="heading-section">
				<h1 class="m-2 fw-bold" id="game-heading"></h1>
			</section>
			<section class="d-flex flex-row align-items-stretch p-md-2" id="status-section">
				<div class="m-2">
					<label class="form-label" for="speed-input"></label>
					<input class="form-control" id="speed-input" type="number" min="1">
				</div>
				<div class="flex-grow-1 d-flex flex-column m-2">
					<label class="form-label d-flex flex-row justify-content-between align-items-center" for="time-input">
						<div id="time-label"></div>
						<div id="time-div"></div>
					</label>
					<input class="form-range" id="time-input" type="range">
				</div>
				<div class="d-flex flex-row align-items-end">
					<button class="btn btn-primary m-2" id="time-button"></button>
				</div>
			</section>
			<div class="position-relative m-2 m-md-0" id="map-div">
				<img class="w-100" id="map-img">
				<svg class="position-absolute" id="svg" viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none"></svg>
				<div class="position-absolute top-50 start-50 translate-middle" id="station-popup"></div>
			</div>
			<section class="d-flex flex-column p-md-2" id="score-section">
				<h2 class="m-2" id="score-heading"></h2>
				<div class="m-2 overflow-y-auto">
					<div class="list-group" id="score-list"></div>
				</div>
			</section>
			<section class="d-flex flex-column p-md-2" id="history-section">
				<h2 class="m-2 text-md-end" id="history-heading"></h2>
				<div class="m-2 overflow-y-auto">
					<div class="list-group" id="history-list"></div>
				</div>
			</section>
		</div>
		<script type="module" src="timelapse.js"></script>
	</body>
</html>
