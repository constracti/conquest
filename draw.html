<!doctype html>
<html data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="constracti">
		<link rel="shortcut icon" href="flag.png">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<style id="game-style"></style>
	</head>
	<body class="container d-flex flex-column p-2 draw">
		<h1 class="m-2" id="game-heading"></h1>
		<h2 class="m-2" id="page-heading"></h2>
		<div class="d-flex flex-row justify-content-between align-items-center">
			<h3 class="m-2" id="score-heading"></h3>
			<button class="btn btn-secondary btn-sm m-2" id="score-button"></button>
		</div>
		<div class="list-group m-2" id="histogram-div"></div>
		<form class="d-flex flex-row align-items-end" id="threshold-form">
			<div class="m-2">
				<label class="form-label" for="threshold-input"></label>
				<input class="form-control" id="threshold-input" type="number" min="1">
			</div>
			<button class="btn btn-primary m-2" id="threshold-submit"></button>
		</form>
		<div class="d-flex flex-column" id="main-div"></div>
		<script type="module" src="draw.js"></script>
	</body>
</html>
