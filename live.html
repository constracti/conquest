<!doctype html>
<html data-bs-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="constracti">
		<title></title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<link rel="stylesheet" href="font-family.css">
		<link rel="stylesheet" href="live.css">
	</head>
	<body class="d-flex flex-column">
		<div class="position-relative" id="canvas">
			<img class="w-100" id="map-img">
			<svg class="position-absolute" id="svg" viewBox="0 0 100 100" width="100%" height="100%" preserveAspectRatio="none"></svg>
			<div class="p-2" id="heading-section">
				<h1 class="m-2 fw-bold"></h1>
			</div>
			<section class="d-flex flex-column p-2" id="score-section">
				<h2 class="m-2">Score</h2>
				<div class="m-2 overflow-y-auto">
					<div class="list-group" id="score-list"></div>
				</div>
			</section>
			<section class="d-flex flex-column p-2" id="history-section">
				<h2 class="m-2">Successes</h2>
				<div class="m-2 overflow-y-auto">
					<div class="list-group" id="history-list"></div>
				</div>
			</section>
		</div>
		<div class="d-flex flex-column" id="footer-div"></div>
		<script type="module" src="./live.js"></script>
	</body>
</html>
