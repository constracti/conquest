<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="constracti">
		<link rel="shortcut icon" href="flag.png">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
	</head>
	<body class="container d-flex flex-column p-2">
		<div class="d-flex flex-row justify-content-between align-items-center">
			<h1 class="m-2" id="game-heading"></h1>
			<div class="m-2 spinner-border" id="spinner-div"></div>
		</div>
		<div class="m-2 alert alert-info d-none p-2" id="timer-div"></div>
		<form class="m-2 border rounded d-none d-flex flex-column p-2" id="login-form">
			<div class="m-2">
				<label class="form-label" for="station-select">Station</label>
				<span class="text-danger">*</span>
				<select class="form-select" id="station-select" name="station" required></select>
			</div>
			<div class="m-2">
				<label class="form-label" for="station-code">Code</label>
				<span class="text-danger">*</span>
				<input class="form-control" id="station-code" name="code" type="password" required>
			</div>
			<div class="d-flex flex-row">
				<button class="m-2 btn btn-primary">Login</button>
			</div>
		</form>
		<div class="d-flex flex-column d-none" id="main-div">
			<div class="d-flex flex-row justify-content-between align-items-center">
				<h2 class="m-2" id="name-heading"></h2>
				<button class="m-2 btn btn-secondary" id="logout-button">Logout</button>
			</div>
			<div class="d-flex flex-row flex-wrap">
				<div class="m-2 badge text-bg-info" id="capacity-badge"></div>
				<div class="m-2 badge text-bg-info" id="score-sign-badge"></div>
				<div class="m-2 badge text-bg-info" id="score-base-badge"></div>
				<div class="m-2 badge text-bg-info" id="score-high-badge"></div>
			</div>
			<form class="m-2 border rounded d-flex flex-row p-1" id="player-form">
				<label class="m-1 col-form-label-sm" for="mark-input">Mark</label>
				<div class="m-1 flex-grow-1">
					<input class="form-control form-control-sm" id="mark-input" name="mark" required>
				</div>
				<button class="m-1 btn btn-primary btn-sm">Search</button>
			</form>
			<div class="m-2 list-group d-none" id="player-list"></div>
			<form class="m-2 border rounded d-flex flex-row p-1 d-none" id="attempt-form">
				<label class="m-1 col-form-label-sm" for="score-input">Score</label>
				<div class="m-1 flex-grow-1">
					<input class="form-control form-control-sm" id="score-input" type="number" name="score" required>
				</div>
				<button class="m-1 btn btn-primary btn-sm">Submit</button>
			</form>
			<h3 class="m-2">Attempts</h3>
			<div class="m-2 list-group" id="attempt-list"></div>
		</div>
		<script src="color-mode.js"></script>
		<script type="module" src="station.js"></script>
	</body>
</html>
