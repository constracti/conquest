<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="author" content="constracti">
		<title>The Station War</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
		<link rel="stylesheet" href="station.css">
	</head>
	<body class="container d-flex flex-column p-2">
		<div class="d-flex flex-row justify-content-between align-items-center">
			<h1 class="m-2">The Station War</h1>
			<div class="m-2 spinner-border" id="spinner-div"></div>
		</div>
		<form class="m-2 border rounded d-none d-flex flex-column p-2" id="login-form">
			<div class="m-2">
				<label class="form-label" for="station-select">Station</label>
				<span class="text-danger">*</span>
				<select class="form-select" id="station-select" name="station" required="required"></select>
			</div>
			<div class="m-2">
				<label class="form-label" for="station-code">Code</label>
				<span class="text-danger">*</span>
				<input class="form-control" id="station-code" name="code" type="password" required="required">
			</div>
			<div class="d-flex flex-row">
				<button class="m-2 btn btn-primary">Login</button>
			</div>
		</form>
		<div class="d-flex flex-column d-none" id="main-div">
			<div class="d-flex flex-row justify-content-between align-items-center">
				<h2 class="m-2" id="name-heading"></h2>
				<button class="m-2 btn btn-secondary" id="logout-button">Logout</button>
			</div>
			<div class="m-2 alert alert-info d-flex flex-row align-items-center p-1" id="alert-div">asdf</div>
			<div class="d-flex flex-column" id="keyboard-div">
				<div class="d-flex flex-row justify-content-center">
					<div class="m-2">
						<input class="form-control text-center" id="keyboard-screen" readonly="readonly">
					</div>
				</div>
				<div class="d-flex flex-row justify-content-center">
					<button class="m-2 btn btn-outline-secondary keyboard-number">1</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">2</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">3</button>
				</div>
				<div class="d-flex flex-row justify-content-center">
					<button class="m-2 btn btn-outline-secondary keyboard-number">4</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">5</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">6</button>
				</div>
				<div class="d-flex flex-row justify-content-center">
					<button class="m-2 btn btn-outline-secondary keyboard-number">7</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">8</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">9</button>
				</div>
				<div class="d-flex flex-row justify-content-center">
					<button class="m-2 btn btn-outline-danger" id="keyboard-delete">&#x2718;</button>
					<button class="m-2 btn btn-outline-secondary keyboard-number">0</button>
					<button class="m-2 btn btn-outline-success" id="keyboard-submit">&#x2714;</button>
				</div>
			</div>
			<div class="m-2 list-group d-none" id="player-list"></div>
			<form class="row m-0" id="win-form">
				<div class="p-0 col-12 col-lg-4 d-flex flex-column">
					<button class="m-2 btn btn-primary win-button" name="type" value="simple">Success</button>
				</div>
				<div class="p-0 col-12 col-lg-4 d-flex flex-column">
					<button class="m-2 btn btn-primary win-button" name="type" value="neutralization">Success and Neutralization</button>
				</div>
				<div class="p-0 col-12 col-lg-4 d-flex flex-column">
					<button class="m-2 btn btn-primary win-button" name="type" value="conquest">Success and Conquest</button>
				</div>
			</form>
		</div>
		<script src="color-mode.js"></script>
		<script type="module" src="station2.js"></script>
	</body>
</html>
